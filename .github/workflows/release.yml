name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without v, for example 1.2.3
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          if git show-ref --tags --verify --quiet "refs/tags/v$VERSION"; then
            echo '::error::The release tag already exists.'
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  full-ci:
    name: Full CI
    needs: validate-version
    uses: ./.github/workflows/_ci.yml
    secrets: inherit

  publish:
    name: Create tag and GitHub Release
    needs: [validate-version, full-ci]
    if: ${{ needs.full-ci.result == 'success' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Verify main is unchanged and create tag
        env:
          TAG: ${{ needs.validate-version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main --prune --tags
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          git config user.name 'release-bot[bot]'
          git config user.email 'release-bot@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate-version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
